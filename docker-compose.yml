version: '3.9'

services:
  backend:
    build: .
    container_name: nest-backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # Own road matching for day routes (no data sent to Google)
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    networks:
      - observability

  # Road matching (OpenStreetMap roads). Prepare data once:
  #   ./infra/osrm/setup.sh africa/zambia
  # Until then it waits, and day routes show the cleaned GPS path.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: sfa-osrm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -f /data/region.osrm.mldgr ]; then
          exec osrm-routed --algorithm mld --max-matching-size 100 /data/region.osrm;
        else
          echo 'OSRM: no road data yet. Run infra/osrm/setup.sh, then restart this container.';
          exec sleep infinity;
        fi
    volumes:
      - ./infra/osrm/data:/data:ro
    mem_limit: 3g
    networks:
      - observability

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Data source and the "SFA Overview" dashboard are set up automatically.
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - observability

  # Host CPU / memory / disk for Grafana and the disk-full alert.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped
    networks:
      - observability

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
