# Prometheus alert rules. They show in Prometheus (Alerts tab) and Grafana.
# The API also raises its own alerts (MIS → Monitoring) and notifies Super
# Admins; these rules cover the cases where the API itself is down.
groups:
  - name: sfa-backend
    rules:
      - alert: BackendDown
        expr: up{job="sfa-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: SFA API is not responding to Prometheus
      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of API requests fail with 5xx
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 95th percentile API latency above 3 s
      - alert: EventLoopBlocked
        expr: nodejs_eventloop_lag_p99_seconds > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Node event loop lag p99 above 500 ms
      - alert: ErpBacklogGrowing
        expr: sum(sfa_erp_backlog{status="FAILED"}) > 0 and delta(sum(sfa_erp_backlog{status="FAILED"})[1h:]) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: Records failing to reach ERP keep increasing
      - alert: OfflineChangesStuck
        expr: sfa_sync_stuck_changes > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} offline change(s) stuck on phones; resolve in MIS → Offline Sync Issues"

  - name: host
    rules:
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.1
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Less than 10% disk free on {{ $labels.mountpoint }}"
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: Host memory above 90%
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Redis is down (logins and sessions fail)
